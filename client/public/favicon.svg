<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48" fill="none">
  <defs>
    <linearGradient id="rl-bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#047857" />
      <stop offset="50%" stop-color="#065f46" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    
    <linearGradient id="rl-neon-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="60%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>

    <radialGradient id="rl-lens-glow" cx="45%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#34D399" stop-opacity="0.35" />
      <stop offset="70%" stop-color="#06B6D4" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#06B6D4" stop-opacity="0" />
    </radialGradient>
    
    <linearGradient id="rl-border-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6ee7b7" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0.2" />
    </linearGradient>
  </defs>

  <!-- Squircle Base -->
  <rect x="2" y="2" width="44" height="44" rx="12" fill="url(#rl-bg-grad)" />
  <rect x="2.5" y="2.5" width="43" height="43" rx="11.5" stroke="url(#rl-border-grad)" stroke-width="1" />

  <!-- Background Resume Document Silhouette -->
  <path d="M12 12C12 10.8954 12.8954 10 14 10H25L32 17V34C32 35.1046 31.1046 36 30 36H14C12.8954 36 12 35.1046 12 34V12Z" 
        fill="#082b21" stroke="#10b981" stroke-width="1.2" stroke-opacity="0.5" />
  
  <!-- Folded corner on document -->
  <path d="M25 10V16C25 16.5523 25.4477 17 26 17H32" 
        stroke="#10b981" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" stroke-opacity="0.6" />
  
  <!-- Document Content Preview Lines -->
  <line x1="16" y1="18" x2="21" y2="18" stroke="#34d399" stroke-width="1.5" stroke-linecap="round" stroke-opacity="0.8" />
  <line x1="16" y1="22" x2="22" y2="22" stroke="#6ee7b7" stroke-width="1.5" stroke-linecap="round" stroke-opacity="0.5" />
  <line x1="16" y1="26" x2="19" y2="26" stroke="#6ee7b7" stroke-width="1.5" stroke-linecap="round" stroke-opacity="0.5" />

  <!-- Magnifying Optical Lens -->
  <circle cx="27" cy="25" r="9" fill="url(#rl-lens-glow)" />
  
  <!-- Lens Glass Reflection Highlight Arc -->
  <path d="M22 21C23.3 19.5 25.2 18.5 27.2 18.5" stroke="#ffffff" stroke-width="1.2" stroke-linecap="round" stroke-opacity="0.75" />
  
  <!-- Lens Outer Ring -->
  <circle cx="27" cy="25" r="9" stroke="url(#rl-neon-grad)" stroke-width="2.2" />
  
  <!-- Lens Handle / Focus Extension -->
  <path d="M33.5 31.5L38.5 36.5" stroke="url(#rl-neon-grad)" stroke-width="2.5" stroke-linecap="round" />
  
  <!-- Focused Target Reticle inside Lens -->
  <circle cx="27" cy="25" r="2" fill="#38BDF8" />
  <circle cx="27" cy="25" r="4.5" stroke="#34D399" stroke-width="0.8" stroke-dasharray="2 1.5" stroke-opacity="0.8" />

  <!-- AI Sparkle at Top Right of Lens -->
  <path d="M36 10C36 12 37.5 13.5 39.5 13.5C37.5 13.5 36 15 36 17C36 15 34.5 13.5 32.5 13.5C34.5 13.5 36 12 36 10Z" 
        fill="#34D399" />
  <circle cx="36" cy="13.5" r="0.8" fill="#ffffff" />
</svg>